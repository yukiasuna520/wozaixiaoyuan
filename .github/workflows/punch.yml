name: 我在校园蓝牙打卡

on:
  workflow_dispatch:          # 手动触发，用来测试

  # ⚠️ 定时任务默认关闭，确认手动能跑通再启用。
  # 启用方法：去掉下面三行的 #。
  # 签到窗口是每天 22:30-23:00（北京时间）= 14:30-15:00 UTC
  # 定时排在 22:40（14:40 UTC），窗口内还剩 20 分钟
  # GitHub 的 cron 会延迟 5-15 分钟，最晚约 22:55 启动，仍在窗口内
  # schedule:
  #   - cron: '40 14 * * *'

jobs:
  punch:
    runs-on: ubuntu-24.04
    environment: CONFIG_01
    timeout-minutes: 30
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip -i https://pypi.tuna.tsinghua.edu.cn/simple
          pip install -r requirements.txt -i https://pypi.tuna.tsinghua.edu.cn/simple

      - name: 执行打卡
        env:
          PYTHONUNBUFFERED: '1'
          school_name: ${{ secrets.school_name }}
          wzxy_username: ${{ secrets.wzxy_username }}
          wzxy_password: ${{ secrets.wzxy_password }}
          max_wait_min: '15'
        run: python -u actionVersion.py
