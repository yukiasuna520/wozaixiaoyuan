name: 我在校园蓝牙打卡

on:
  workflow_dispatch:          # 手动触发，用来测试

  # 定时任务：每天北京时间 22:35（UTC 14:35）自动运行
  # 签到窗口 22:30-23:00，触发时窗口已开，进去直接打卡
  schedule:
    - cron: '35 14 * * *'

jobs:
  punch:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false        # 一个人失败不影响其他人
      matrix:
        # ⬇️ 加人只需在这下面加一行，并在 Settings → Environments 建同名环境
        environment: [CONFIG_01, CONFIG_02, CONFIG_03, CONFIG_04]
    environment: ${{ matrix.environment }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip -i https://pypi.tuna.tsinghua.edu.cn/simple
          pip install -r requirements.txt -i https://pypi.tuna.tsinghua.edu.cn/simple

      - name: 执行打卡
        env:
          PYTHONUNBUFFERED: '1'
          school_name: ${{ secrets.school_name }}
          wzxy_username: ${{ secrets.wzxy_username }}
          wzxy_password: ${{ secrets.wzxy_password }}
          max_wait_min: '15'
          receive_mail: ${{ secrets.receive_mail }}
          mail_address: ${{ secrets.mail_address }}
          mail_password: ${{ secrets.mail_password }}
          mail_host: ${{ secrets.mail_host }}
          sct_ftqq: ${{ secrets.sct_ftqq }}
        run: python -u actionVersion.py
